<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>og</title>
<link rel="stylesheet" href="../../site.css">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#F3F5F7}
  .og{position:relative;width:1200px;height:630px;display:grid;grid-template-columns:500px 1fr;align-items:center}
  .og .colorbar{position:absolute;left:0;right:0;top:0;height:8px;background-size:256px 100%}
  .card{position:relative;justify-self:center;width:300px;margin-top:10px}
  .card img{width:100%;height:auto;border-radius:3.4%/2.4%;box-shadow:0 1px 1px rgba(20,22,26,.18),0 22px 40px -16px rgba(20,22,26,.4)}
  .card .ov{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .ov .o-trim path{stroke:#14161A;stroke-width:2.2;fill:none;vector-effect:non-scaling-stroke}
  .ov .o-lines line{stroke:#00A0DC;stroke-width:2;vector-effect:non-scaling-stroke}
  .ov .o-reg g{mix-blend-mode:multiply}
  .ov .o-reg circle,.ov .o-reg path{fill:none;stroke-width:2.2;vector-effect:non-scaling-stroke}
  .ov .o-reg .c{stroke:#00A0DC}.ov .o-reg .m{stroke:#D6247B}.ov .o-reg .y{stroke:#F2C200}
  .ov text{font:720 70px/1 Archivo;font-stretch:112%;fill:#14161A;font-variant-numeric:tabular-nums}
  .copy{padding-right:70px}
  .ov g{opacity:1 !important}
  .mark{font:840 86px/0.9 Archivo;font-stretch:125%;letter-spacing:-.03em;color:#14161A;margin:0 0 34px}
  .ro{display:grid;grid-template-columns:auto auto;gap:6px 26px;align-items:baseline;justify-content:start;font-variant-numeric:tabular-nums}
  .ro span{font:560 26px/1.2 Archivo;color:#4A515C}
  .ro b{font:760 56px/1.05 Archivo;font-stretch:115%;color:#14161A}
  .mat{position:absolute;left:0;right:0;bottom:0;height:22px}
</style></head>
<body><div class="og">
<div class="colorbar"></div>
<div class="card"><img src="../../assets/img/card-offcenter-640.webp" alt="">
<svg class="ov" viewBox="0 0 1040 1459">
<g class="o-trim"><path d="M-24 0H-84M0-24V-84M1064 0H1124M1040-24V-84M-24 1459H-84M0 1483V1543M1064 1459H1124M1040 1483V1543"/></g>
<g class="o-lines"><line x1="45.5" y1="-110" x2="45.5" y2="1569"/><line x1="999.5" y1="-110" x2="999.5" y2="1569"/><line x1="-110" y1="41" x2="1150" y2="41"/><line x1="-110" y1="1419" x2="1150" y2="1419"/></g>
<g class="o-reg">
<g transform="translate(45.5 41)"><g class="c"><circle r="30"/><path d="M-50 0H50M0-50V50"/></g><g class="m"><circle r="30"/><path d="M-50 0H50M0-50V50"/></g><g class="y"><circle r="30"/><path d="M-50 0H50M0-50V50"/></g></g>
<g transform="translate(999.5 41)"><g class="c"><circle r="30"/><path d="M-50 0H50M0-50V50"/></g><g class="m"><circle r="30"/><path d="M-50 0H50M0-50V50"/></g><g class="y"><circle r="30"/><path d="M-50 0H50M0-50V50"/></g></g>
<g transform="translate(45.5 1419)"><g class="c" transform="translate(-9 -7)"><circle r="30"/><path d="M-50 0H50M0-50V50"/></g><g class="m" transform="translate(8 -6)"><circle r="30"/><path d="M-50 0H50M0-50V50"/></g><g class="y" transform="translate(-2 9)"><circle r="30"/><path d="M-50 0H50M0-50V50"/></g></g>
<g transform="translate(999.5 1419)"><g class="c"><circle r="30"/><path d="M-50 0H50M0-50V50"/></g><g class="m"><circle r="30"/><path d="M-50 0H50M0-50V50"/></g><g class="y"><circle r="30"/><path d="M-50 0H50M0-50V50"/></g></g>
</g>
<text x="-40" y="752" text-anchor="end">52.9</text><text x="1080" y="752">47.1</text>
</svg></div>
<div class="copy">
<p class="mark">CenterMint</p>
<div class="ro"><span>↔</span><b>52.9 / 47.1</b><span>↕</span><b>50.6 / 49.4</b></div>
</div>

</div></body></html>
